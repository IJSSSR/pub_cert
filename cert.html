<html lang="en">

<meta charset="UTF-8">

<title>IJSSSR Certificate Generator</title>
<style>

  .form-section input, 
  .form-section textarea, 
  .form-section select {

    margin-top: 6px;

    font-size: 15px;

  }

  .button-group {
    text-align: center;
    margin-top: 25px;
  }

  /* Preview Section */
  .preview-section {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
  }

  .preview-section h3 {
    color: #215868;
    font-size: 24px;
    margin-bottom: 20px;

  .certificates-preview {

  .cert-preview-card {
    width: 350px;
    background: #fff;
    border: 1px solid #ddd;

    padding: 15px;

  .cert-preview-card h4 {

    margin: 0 0 10px 0;
    padding-bottom: 5px;
    border-bottom: 2px solid #004d40;
  }

  .cert-mini {
    font-size: 11px;
    line-height: 1.4;
    color: #333;
  }

  .cert-mini .mini-header {
    font-weight: bold;
    color: #003300;
    text-align: center;
  }

  .cert-mini .mini-divider {
    height: 2px;
    background: #004d40;
    margin: 8px 0;
  }

  .cert-mini .mini-meta {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
  }

  .cert-mini .mini-title {
    font-weight: bold;
    color: #005E00;
    text-align: center;
    margin: 8px 0;
  }

  .button-small {
    background-color: #215868;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 10px;
    width: 100%;
  }

  .button-small:hover {
    background-color: #1a4452;
  }
</style>
</head>
<body>
<div class="container">
  <div class="form-section">
    <h2>IJSSSR Certificate Generator</h2>

    <label>Certificate No: (6 digits)</label>
    <input type="text" id="certNo" placeholder="e.g., 250065" maxlength="6">
    
    <label>Author(s) Name (separate by comma):</label>

      <option value="">-- Select Year --</option>

      <option value="2024">2024</option>

      <option value="2026">2026</option>
      <option value="2027">2027</option>
      <option value="2028">2028</option>
      <option value="2029">2029</option>
      <option value="2030">2030</option>
      <option value="2031">2031</option>
      <option value="2032">2032</option>
      <option value="2033">2033</option>
      <option value="2034">2034</option>
      <option value="2035">2035</option>
      <option value="2036">2036</option>
      <option value="2037">2037</option>
      <option value="2038">2038</option>
      <option value="2039">2039</option>
      <option value="2040">2040</option>
      <option value="2041">2041</option>
      <option value="2042">2042</option>
      <option value="2043">2043</option>
      <option value="2044">2044</option>
      <option value="2045">2045</option>
      <option value="2046">2046</option>
      <option value="2047">2047</option>
      <option value="2048">2048</option>
      <option value="2049">2049</option>

    </select>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
// =========================================================
// डेवलपर के लिए नोट (यूजर को नहीं दिखेगा):
// 
// लोगो लगाने के लिए - LOGO_IMAGE_BASE64 में base64 code डालें
// वॉटरमार्क के लिए - WATERMARK_IMAGE_BASE64 में base64 code डालें
// सिग्नेचर के लिए - SIGNATURE_1_BASE64 और SIGNATURE_2_BASE64 में base64 code डालें
// =========================================================

const LOGO_IMAGE_BASE64 = '';        // यहाँ लोगो का base64 डालें



const WATERMARK_IMAGE_BASE64 = '';   // यहाँ वॉटरमार्क का base64 डालें



const SIGNATURE_1_BASE64 = '';       // डॉ. अशोक कुमार शुक्ला का सिग्नेचर




const SIGNATURE_2_BASE64 = '';       // डॉ. गगन प्रीत कौर का सिग्नेचर

// =========================================================
// Date Format Function - Proper English Date
// =========================================================
function formatDate(dateString) {
  if(!dateString) return "";
  const date = new Date(dateString);
  if(isNaN(date.getTime())) return dateString;
  
  const day = date.getDate();
  const monthNames = ["January", "February", "March", "April", "May", "June",
                      "July", "August", "September", "October", "November", "December"];
  const month = monthNames[date.getMonth()];
  const year = date.getFullYear();
  
  let suffix = "th";
  if(day === 1 || day === 21 || day === 31) suffix = "st";
  else if(day === 2 || day === 22) suffix = "nd";
  else if(day === 3 || day === 23) suffix = "rd";
  
  return `${day}${suffix} ${month} ${year}`;
}

// =========================================================
// JSON Data Load
// =========================================================
let certData = [];

fetch('https://ijsssr.github.io/pub_cert/certificate-data.json')
  .then(res => res.json())
  .then(data => { certData = data; })
  .catch(err => console.error("Data file not found!", err));

function showError(msg) {
  alert(msg);
}

// Certificate No. validation
document.getElementById("certNo").addEventListener("blur", function() {
  const value = this.value.trim();
  if(value && !/^\d{6}$/.test(value)){
    showError("Certificate No. must be 6 digits!");
    this.value = '';
    document.getElementById("paperId").value = '';
    return;
  }

  if(value && certData.length > 0) {
    const match = certData.find(d => d.certNo === value);
    if(match){
      document.getElementById("paperId").value = match.paperId;
    } else {
      document.getElementById("paperId").value = '';
      showError("Certificate No. not found!");
    }
  }
});

// Paper ID validation
document.getElementById("paperId").addEventListener("blur", function() {
  const value = this.value.trim();
  if(value && !/^IJSSSR-\d{4}$/.test(value)){
    showError("Paper ID must be in format IJSSSR-XXXX (4 digits)!");
    this.value = '';
    document.getElementById("certNo").value = '';
    return;
  }

  if(value && certData.length > 0) {
    const match = certData.find(d => d.paperId === value);
    if(match){
      document.getElementById("certNo").value = match.certNo;
    } else {
      document.getElementById("certNo").value = '';
      showError("Paper ID not found!");
    }
  }
});

function validateForm() {
  const certNo = document.getElementById("certNo").value.trim();
  const authors = document.getElementById("authors").value.trim();
  const affiliations = document.getElementById("affiliations").value.trim();
  const title = document.getElementById("title").value.trim();
  const paperId = document.getElementById("paperId").value.trim();
  const volume = document.getElementById("volume").value.trim();
  const issue = document.getElementById("issue").value;
  const quarter = document.getElementById("quarter").value;
  const year = document.getElementById("year").value;
  const publicationDate = document.getElementById("publicationDate").value;
  const qrLink = document.getElementById("qrLink").value.trim();

  if(!certNo || !authors || !affiliations || !title || !paperId || !volume || !issue || !quarter || !year || !publicationDate || !qrLink){
    alert("All fields are mandatory except Submission Date and Acceptance Date. Please fill all required fields.");
    return false;
  }
  
  if(!/^\d{6}$/.test(certNo)) {
    alert("Certificate No. must be 6 digits!");
    return false;
  }
  
  if(!/^IJSSSR-\d{4}$/.test(paperId)) {
    alert("Paper ID must be in format IJSSSR-XXXX (4 digits)!");
    return false;
  }
  
  return true;
}

// =========================================================
// Preview Generation
// =========================================================
async function generatePreviews() {
  if(!validateForm()) return;
  
  const previewContainer = document.getElementById("certificatesPreview");
  previewContainer.innerHTML = "";
  document.getElementById("previewSection").style.display = "block";
  
  const certNo = document.getElementById("certNo").value.trim();
  const authors = document.getElementById("authors").value.split(",").map(a => a.trim());
  const affLines = document.getElementById("affiliations").value.split("\n").map(a => a.trim());
  const title = document.getElementById("title").value.trim();
  const paperId = document.getElementById("paperId").value.trim();
  const volume = document.getElementById("volume").value.trim();
  const issue = document.getElementById("issue").value;
  const quarter = document.getElementById("quarter").value;
  const year = document.getElementById("year").value;
  const submissionDate = document.getElementById("submissionDate").value;
  const acceptanceDate = document.getElementById("acceptanceDate").value;
  const publicationDate = document.getElementById("publicationDate").value;
  
  const formattedSubmission = formatDate(submissionDate);
  const formattedAcceptance = formatDate(acceptanceDate);
  const formattedPublication = formatDate(publicationDate);
  
  for(let i = 0; i < authors.length; i++) {
    const currentAff = affLines[i] || affLines[0] || "";
    const thisCertNo = authors.length > 1 ? `${certNo}-${i+1}` : certNo;
    
    let datesHTML = "";
    if(formattedSubmission) datesHTML += `<div><strong>Submission Date:</strong> ${formattedSubmission}</div>`;
    if(formattedAcceptance) datesHTML += `<div><strong>Acceptance Date:</strong> ${formattedAcceptance}</div>`;
    datesHTML += `<div><strong>Publication Date:</strong> ${formattedPublication}</div>`;
    
    const card = document.createElement("div");
    card.className = "cert-preview-card";
    card.innerHTML = `
      <h4>Certificate ${i+1} of ${authors.length}</h4>
      <div class="cert-mini">
        <div class="mini-header">International Journal of Science and Social Science Research (IJSSSR)</div>
        <div class="mini-divider"></div>
        <div class="mini-meta">
          <span>Cert. No.: ${thisCertNo}</span>
          <span>Date: ${formattedPublication}</span>
        </div>
        <div class="mini-title">CERTIFICATE OF PUBLICATION</div>
        <div><strong>Author:</strong> ${authors[i]}</div>
        <div><strong>Affiliation:</strong> ${currentAff.substring(0, 50)}${currentAff.length > 50 ? '...' : ''}</div>
        <div><strong>Paper:</strong> ${title.substring(0, 40)}${title.length > 40 ? '...' : ''}</div>
        <div><strong>Issue:</strong> Vol. ${volume} No. ${issue}, ${quarter} ${year}</div>
        <div><strong>Paper ID:</strong> ${paperId}</div>
        ${datesHTML}
      </div>
      <button class="button-small" onclick="downloadSinglePDF(${i})">Download PDF</button>
    `;
    previewContainer.appendChild(card);
  }
}

// =========================================================
// Single PDF Download
// =========================================================
async function downloadSinglePDF(index) {
  const certificates = await generateCertificatesData();
  if(certificates && certificates[index]) {
    await createPDF(certificates[index]);
  }
}

// =========================================================
// All PDFs Download
// =========================================================
async function downloadAllPDFs() {
  if(!validateForm()) return;
  
  const certificates = await generateCertificatesData();
  for(let i = 0; i < certificates.length; i++) {
    await createPDF(certificates[i]);
  }
}

// =========================================================
// Generate Certificates Data
// =========================================================
async function generateCertificatesData() {
  const certNo = document.getElementById("certNo").value.trim();
  const authors = document.getElementById("authors").value.split(",").map(a => a.trim());
  const affLines = document.getElementById("affiliations").value.split("\n").map(a => a.trim());
  const title = document.getElementById("title").value.trim();
  const paperId = document.getElementById("paperId").value.trim();
  const volume = document.getElementById("volume").value.trim();
  const issue = document.getElementById("issue").value;
  const quarter = document.getElementById("quarter").value;
  const year = document.getElementById("year").value;
  const submissionDate = document.getElementById("submissionDate").value;
  const acceptanceDate = document.getElementById("acceptanceDate").value;
  const publicationDate = document.getElementById("publicationDate").value;
  const qrLink = document.getElementById("qrLink").value.trim();

  const certificates = [];
  
  for(let i = 0; i < authors.length; i++) {
    const currentAff = affLines[i] || affLines[0] || "";
    const thisCertNo = authors.length > 1 ? `${certNo}-${i+1}` : certNo;
    
    const qrCanvas = document.createElement("canvas");
    await QRCode.toCanvas(qrCanvas, qrLink, { width: 100, margin: 1 });
    const qrDataURL = qrCanvas.toDataURL("image/png");
    
    certificates.push({
      certNo: thisCertNo,
      author: authors[i],
      affiliation: currentAff,
      title: title,
      paperId: paperId,
      volume: volume,
      issue: issue,
      quarter: quarter,
      year: year,
      submissionDate: formatDate(submissionDate),
      acceptanceDate: formatDate(acceptanceDate),
      publicationDate: formatDate(publicationDate),
      qrDataURL: qrDataURL
    });
  }
  
  return certificates;
}

// =========================================================
// Create PDF - Natural Language + 1 Inch Gap Between Dates Box & Bottom Section
// =========================================================
async function createPDF(certData) {
  const { jsPDF } = window.jspdf;
  
  const pdf = new jsPDF({
    orientation: 'portrait',
    unit: 'px',
    format: 'a4'
  });
  
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const margin = 50;
  const contentWidth = pageWidth - (margin * 2);
  
  // 1 inch = 72px (at 72 DPI, jsPDF default)
  const ONE_INCH = 72;
  
  pdf.setFont("Times", "Roman");
  
  // =========================================================
  // BOTTOM SECTION POSITION - PEHLE CALCULATE KARO
  // =========================================================
  const bottomSectionHeight = 100;      // signature + text + QR area
  const bottomPageMargin = 40;          // page bottom se margin
  const bottomY = pageHeight - bottomSectionHeight - bottomPageMargin;
  
  // =========================================================
  // HEADER SECTION
  // =========================================================
  
  // Logo
  if(LOGO_IMAGE_BASE64) {
    try {
      pdf.addImage(LOGO_IMAGE_BASE64, 'PNG', 40, 30, 70, 70);
    } catch(e) {
      pdf.setDrawColor(200, 200, 200);
      pdf.setFillColor(250, 250, 250);
      pdf.roundedRect(40, 30, 70, 70, 5, 5, 'FD');
    }
  } else {
    pdf.setDrawColor(200, 200, 200);
    pdf.setFillColor(250, 250, 250);
    pdf.roundedRect(40, 30, 70, 70, 5, 5, 'FD');
  }
  
  // ISSN
  pdf.setTextColor(0, 51, 102);
  pdf.setFontSize(11);
  pdf.setFont("Times", "bold");
  pdf.text("ISSN: 2583-7877", pageWidth - 120, 50);
  
  // Journal Name
  pdf.setTextColor(0, 51, 0);
  pdf.setFontSize(24);
  pdf.setFont("Times", "bold");
  pdf.text("International Journal of Science and", pageWidth/2, 120, { align: 'center' });
  pdf.text("Social Science Research (IJSSSR)", pageWidth/2, 145, { align: 'center' });
  
  pdf.setFontSize(12);
  pdf.setFont("Times", "italic");
  pdf.text("UGC Approved Peer Reviewed (Refereed) Journal", pageWidth/2, 170, { align: 'center' });
  
  pdf.setFont("Times", "normal");
  pdf.setTextColor(0, 51, 0);
  pdf.textWithLink("www.ijsssr.com", pageWidth/2, 190, { align: 'center', url: 'https://www.ijsssr.com' });
  
  // Divider
  pdf.setDrawColor(0, 100, 0);
  pdf.setLineWidth(2);
  pdf.line(margin, 210, pageWidth - margin, 210);
  
  // Meta Info
  pdf.setTextColor(0, 51, 102);
  pdf.setFontSize(11);
  pdf.setFont("Times", "bold");
  pdf.text(`Certificate No.: ${certData.certNo}`, margin, 240);
  pdf.text(`Date: ${certData.publicationDate}`, pageWidth - 160, 240);
  
  // Certificate Header
  pdf.setTextColor(0, 94, 0);
  pdf.setFontSize(26);
  pdf.setFont("Times", "bold");
  pdf.text("CERTIFICATE OF PUBLICATION", pageWidth/2, 300, { align: 'center' });
  
  // =========================================================
  // MAIN CONTENT - NATURAL LANGUAGE (Word-by-Word)
  // =========================================================
  
  const normalColor = [0, 0, 0];
  const highlightColor = [0, 32, 96];
  
  // Build tokens: each token = { text, style }
  const tokens = [];
  const addNormal = (str) => str.split(" ").forEach(w => tokens.push({ text: w, style: 'normal' }));
  const addHighlight = (str) => str.split(" ").forEach(w => tokens.push({ text: w, style: 'highlight' }));
  
  addNormal("This is to certify that");
  addHighlight(certData.author);
  tokens.push({ text: ",", style: 'normal' });
  addHighlight(certData.affiliation);
  addNormal("has published a paper/article entitled");
  tokens.push({ text: '"', style: 'normal' });
  addHighlight(certData.title);
  tokens.push({ text: '"', style: 'normal' });
  addNormal("in the issue");
  addHighlight(`Vol. ${certData.volume} No. ${certData.issue}, ${certData.quarter} ${certData.year}`);
  addNormal("with paper ID");
  addHighlight(certData.paperId);
  tokens.push({ text: ".", style: 'normal' });
  
  // Render tokens
  pdf.setFontSize(12);
  let xPos = margin;
  let yPos = 350;
  const lineHeight = 22;
  const rightEdge = pageWidth - margin;
  
  const isPunctuation = (txt) => [',', '.', '"', ';', ':', '!', '?'].includes(txt);
  
  for(let i = 0; i < tokens.length; i++) {
    const token = tokens[i];
    
    let prefix = "";
    if(i > 0 && !isPunctuation(token.text)) {
      prefix = " ";
    }
    
    const fullText = prefix + token.text;
    
    if(token.style === 'highlight') {
      pdf.setFont("Times", "bold");
      pdf.setTextColor(highlightColor[0], highlightColor[1], highlightColor[2]);
    } else {
      pdf.setFont("Times", "normal");
      pdf.setTextColor(normalColor[0], normalColor[1], normalColor[2]);
    }
    
    const textWidth = pdf.getTextWidth(fullText);
    
    if(xPos + textWidth > rightEdge && xPos > margin) {
      yPos += lineHeight;
      xPos = margin;
      pdf.text(token.text, xPos, yPos);
      xPos += pdf.getTextWidth(token.text);
    } else {
      pdf.text(fullText, xPos, yPos);
      xPos += textWidth;
    }
  }
  
  // Move below paragraph
  yPos += lineHeight + 15;
  
  // =========================================================
  // IMPORTANT DATES BOX - Position calculated so 1 inch gap always
  // remains between box bottom and bottom section top
  // =========================================================
  
  const dateItems = [];
  if(certData.submissionDate && certData.submissionDate.trim() !== "") {
    dateItems.push({ label: "Submission Date", value: certData.submissionDate });
  }
  if(certData.acceptanceDate && certData.acceptanceDate.trim() !== "") {
    dateItems.push({ label: "Acceptance Date", value: certData.acceptanceDate });
  }
  dateItems.push({ label: "Publication Date", value: certData.publicationDate });
  
  const boxHeight = 30 + (dateItems.length * 20);
  
  // Bottom section ka top
  const bottomSectionTop = bottomY - 30; // signature placeholder top
  
  // Important Dates box ki bottom = bottomSectionTop - 1 inch
  const datesBoxBottom = bottomSectionTop - ONE_INCH;
  
  // Box ki top position
  let datesBoxY = datesBoxBottom - boxHeight;
  
  // Agar paragraph ke baad ki jagah kam pad rahi hai, toh box ko forced position pe rakho
  // (lekin 1 inch gap hamesha maintain karo)
  if(datesBoxY < yPos) {
    // Paragraph aur box ke beech gap kam karo, lekin 1 inch gap bottom se maintain karo
    datesBoxY = datesBoxBottom - boxHeight;
  }
  
  // Dates box
  pdf.setDrawColor(0, 100, 0);
  pdf.setLineWidth(1);
  pdf.setFillColor(245, 250, 245);
  pdf.roundedRect(margin, datesBoxY, contentWidth, boxHeight, 5, 5, 'FD');
  
  pdf.setTextColor(0, 94, 0);
  pdf.setFontSize(13);
  pdf.setFont("Times", "bold");
  pdf.text("Important Dates", pageWidth/2, datesBoxY + 20, { align: 'center' });
  
  pdf.setDrawColor(0, 100, 0);
  pdf.setLineWidth(0.5);
  pdf.line(margin + 15, datesBoxY + 28, pageWidth - margin - 15, datesBoxY + 28);
  
  let dateY = datesBoxY + 48;
  pdf.setFontSize(12);
  
  for(let i = 0; i < dateItems.length; i++) {
    const item = dateItems[i];
    
    pdf.setFont("Times", "bold");
    pdf.setTextColor(0, 51, 102);
    pdf.text(`${item.label}:`, margin + 20, dateY);
    
    pdf.setFont("Times", "normal");
    pdf.setTextColor(0, 0, 0);
    pdf.text(item.value, margin + 160, dateY);
    
    dateY += 20;
  }
  
  // =========================================================
  // BOTTOM SECTION - FIXED AT BOTTOM OF PAGE
  // =========================================================
  
  // Left Editor
  if(SIGNATURE_1_BASE64) {
    try {
      pdf.addImage(SIGNATURE_1_BASE64, 'PNG', margin, bottomY - 30, 80, 30);
    } catch(e) {
      pdf.setDrawColor(200, 200, 200);
      pdf.setFillColor(250, 250, 250);
      pdf.roundedRect(margin, bottomY - 20, 80, 30, 5, 5, 'FD');
    }
  } else {
    pdf.setDrawColor(200, 200, 200);
    pdf.setFillColor(250, 250, 250);
    pdf.roundedRect(margin, bottomY - 20, 80, 30, 5, 5, 'FD');
  }
  
  pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(11);
  pdf.setFont("Times", "bold");
  pdf.text("Dr. Ashish Kumar Shukla", margin, bottomY + 20);
  pdf.setFont("Times", "normal");
  pdf.text("Editor-in-Chief", margin, bottomY + 35);
  pdf.setTextColor(0, 51, 102);
  pdf.setFontSize(10);
  pdf.text("editors@ijsssr.com", margin, bottomY + 50);
  
  // QR Code
  pdf.addImage(certData.qrDataURL, 'PNG', pageWidth/2 - 35, bottomY - 10, 65, 65);
  pdf.setTextColor(51, 51, 51);
  pdf.setFontSize(10);
  pdf.text("Verified Published Article", pageWidth/2, bottomY + 65, { align: 'center' });
  
  // Right Editor
  if(SIGNATURE_2_BASE64) {
    try {
      pdf.addImage(SIGNATURE_2_BASE64, 'PNG', pageWidth - margin - 80, bottomY - 30, 80, 30);
    } catch(e) {
      pdf.setDrawColor(200, 200, 200);
      pdf.setFillColor(250, 250, 250);
      pdf.roundedRect(pageWidth - margin - 80, bottomY - 20, 80, 30, 5, 5, 'FD');
    }
  } else {
    pdf.setDrawColor(200, 200, 200);
    pdf.setFillColor(250, 250, 250);
    pdf.roundedRect(pageWidth - margin - 80, bottomY - 20, 80, 30, 5, 5, 'FD');
  }
  
  pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(11);
  pdf.setFont("Times", "bold");
  pdf.text("Dr. Gagan Prit Kaur", pageWidth - margin - 80, bottomY + 20);
  pdf.setFont("Times", "normal");
  pdf.text("Editor-in-Chief", pageWidth - margin - 80, bottomY + 35);
  pdf.setTextColor(0, 51, 102);
  pdf.setFontSize(10);
  pdf.text("editorinchief@ijsssr.com", pageWidth - margin - 80, bottomY + 50);
  
  // Save
  pdf.save(`${certData.certNo}.pdf`);
}

// Initialize
window.onload = function() {
  document.getElementById("previewSection").style.display = "none";
};
